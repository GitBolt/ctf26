[package]
name = "overclock-vault"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Keep transitive releases compatible with the Cargo 1.84 bundled in Solana platform-tools 1.48.
# Newer blake3/zeroize releases use manifest features that that SBF toolchain cannot parse.
blake3 = { version = "=1.5.5", features = ["traits-preview"] }
solana-program = { version = "=2.3.0", default-features = false }
zeroize = "=1.8.1"

[profile.release]
opt-level = 3
overflow-checks = false
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
