[package]
name = "overclock-harness"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bincode = "1.3"
hmac = "0.12"
litesvm = "0.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
solana-account = "3.4.0"
solana-address = "2.6.1"
solana-clock = "3.1.1"
solana-hash = "4.2.0"
solana-instruction = "=3.2.0"
solana-keypair = "3.1.2"
solana-message = "3.1.0"
solana-sdk-ids = "3.1.0"
solana-signer = "3.0.0"
solana-transaction = { version = "3.1.0", features = ["verify"] }
