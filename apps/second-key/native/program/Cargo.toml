[package]
name = "second-key-program"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
blake3 = { version = "=1.5.5", features = ["traits-preview"] }
solana-program = { version = "=2.3.0", default-features = false }
zeroize = "=1.8.1"

[profile.release]
opt-level = 3
overflow-checks = true
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
