<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#344555" />
    <meta name="description" content="SIGNET transaction checker." />
    <title>SIGNET</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to checker</a>

    <main id="main" class="challenge">
      <header class="challenge-header">
        <h1>SIGNET</h1>
        <div class="header-actions">
          <span id="connection-status" class="status"><i aria-hidden="true"></i>Connecting</span>
          <a id="source-repository" class="repository-link" href="https://github.com/GitBolt/signet" target="_blank" rel="noreferrer">
            Repository <span aria-hidden="true">↗</span>
          </a>
        </div>
      </header>

      <section class="challenge-body" aria-labelledby="checker-title">
        <h2 id="checker-title">Assigned objective</h2>
        <div class="challenge-brief">
          <p>Move the assigned reserve into its destination, then submit the finalized transaction.</p>
          <a id="starter-download" class="starter-download" href="/signet-starter.tar.gz" download>
            Download starter
          </a>
          <button id="access-key-download" class="starter-download" type="button" hidden>Download access credential</button>
        </div>

        <details class="assignment">
          <summary><span>Target</span><span id="participant-label">loading</span></summary>
          <dl id="target-manifest" aria-busy="true">
            <div><dt>Program</dt><dd>—</dd></div>
          </dl>
          <p id="preview-note" class="preview-note" hidden>Preview accepts <code>demo-drain</code>.</p>
        </details>

        <form id="submission-form" novalidate>
          <label for="transaction-signature">Finalized Solana signature</label>
          <textarea
            id="transaction-signature"
            name="signature"
            rows="3"
            maxlength="128"
            spellcheck="false"
            autocomplete="off"
            placeholder="Paste signature"
            aria-describedby="signature-error"
            required
          ></textarea>
          <div class="form-footer">
            <p id="signature-error" class="error" role="alert" hidden></p>
            <button id="submit-transaction" type="submit"><span>Submit</span></button>
          </div>
        </form>

        <section id="success-result" class="result" aria-live="polite" hidden>
          <div class="result-heading">
            <span class="result-seal" aria-hidden="true">✓</span>
            <div>
              <p class="result-state">Accepted</p>
              <p id="solve-summary" class="result-summary"></p>
            </div>
          </div>
          <label for="flag-output">Flag</label>
          <div class="flag-row">
            <input id="flag-output" type="text" readonly />
            <button id="copy-flag" class="copy-flag" type="button">Copy</button>
          </div>
        </section>

        <p id="global-message" class="fatal" role="status" aria-live="polite" hidden></p>
      </section>
    </main>
  </body>
</html>
